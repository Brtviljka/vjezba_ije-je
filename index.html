<!doctype html>
<html lang="hr" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ije/Je Pogađalica</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; }

    .flower-bounce {
      display: inline-block;
      animation: flowerBounce 1.2s ease-in-out infinite;
    }
    @keyframes flowerBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-8deg); }
      75% { transform: translateY(-4px) rotate(8deg); }
    }

    .btn-option {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-option:hover {
      transform: scale(1.08);
    }
    .btn-option:active {
      transform: scale(0.95);
    }

    .card-enter {
      animation: cardSlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(30px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .result-pop {
      animation: resultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes resultPop {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    .score-pulse {
      animation: scorePulse 0.4s ease;
    }
    @keyframes scorePulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .confetti-piece {
      position: fixed;
      animation: confettiFall 2.5s ease-out forwards;
      pointer-events: none;
      z-index: 100;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100%) rotate(720deg); }
    }

    .star-spin {
      animation: starSpin 0.6s ease;
    }
    @keyframes starSpin {
      from { transform: rotate(0deg) scale(0); }
      to { transform: rotate(360deg) scale(1); }
    }

    .progress-fill {
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .feedback-correct {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0) !important;
      border-color: #34d399 !important;
    }
    .feedback-wrong {
      background: linear-gradient(135deg, #fee2e2, #fecaca) !important;
      border-color: #f87171 !important;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full overflow-auto">
  <div id="app-wrapper" class="h-full w-full flex flex-col items-center justify-start p-4" style="background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 50%, #c3f0ca 100%);"><!-- Header -->
   <div class="text-center mt-4 mb-2">
    <h1 id="game-title" class="text-3xl md:text-4xl font-black drop-shadow-md" style="color: #4a2c82;">🌸 Pogodi -ije ili -je! 🌸</h1>
    <p class="text-xs mt-1 font-bold italic" style="color: #8b6db5;">made by Kaja</p>
    <p id="game-subtitle" class="text-sm font-semibold mt-1" style="color: #6b4c9a;">Klikni na točnu glasovnu skupinu</p>
   </div><!-- Progress Bar -->
   <div id="progress-area" class="w-full max-w-md mb-3 hidden">
    <div class="flex justify-between items-center mb-1"><span id="progress-text" class="text-xs font-bold" style="color: #4a2c82;">Pitanje 1/10</span> <span id="score-display" class="text-xs font-bold px-3 py-1 rounded-full" style="background: rgba(255,255,255,0.7); color: #4a2c82;">⭐ 0/10</span>
    </div>
    <div class="w-full h-3 rounded-full overflow-hidden" style="background: rgba(255,255,255,0.5);">
     <div id="progress-bar" class="progress-fill h-full rounded-full" style="width: 0%; background: linear-gradient(90deg, #f472b6, #8b5cf6, #60a5fa);"></div>
    </div>
   </div><!-- Start Screen -->
   <div id="start-screen" class="w-full max-w-md rounded-3xl p-8 text-center card-enter" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(74,44,130,0.15);">
    <div class="text-6xl mb-4">
     🌺
    </div>
    <h2 class="text-xl font-black mb-3" style="color: #4a2c82;">Spremni za igru?</h2>
    <p class="text-sm mb-6" style="color: #6b4c9a;">U svakoj riječi glasovna skupina <strong>-ije</strong> ili <strong>-je</strong> zamijenjena je cvijetom 🌼. Tvoj je zadatak pogoditi koja skupina nedostaje!</p><button id="start-btn" class="btn-option px-8 py-3 rounded-2xl text-white font-extrabold text-lg shadow-lg" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);"> 🎮 Započni igru! </button>
   </div><!-- Game Screen -->
   <div id="game-screen" class="w-full max-w-md hidden">
    <div id="word-card" class="rounded-3xl p-6 text-center card-enter" style="background: rgba(255,255,255,0.88); backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(74,44,130,0.15);">
     <div id="word-display" class="text-3xl md:text-4xl font-black mb-6 tracking-wide" style="color: #3b1f6e; line-height: 1.4;"></div>
     <div id="feedback-area" class="mb-4 hidden">
      <div id="feedback-msg" class="text-lg font-bold rounded-2xl py-3 px-4 result-pop"></div>
     </div>
     <div id="buttons-area" class="flex gap-4 justify-center"><button id="btn-ije" class="btn-option px-8 py-4 rounded-2xl text-white font-black text-xl shadow-lg" style="background: linear-gradient(135deg, #f472b6, #ec4899);"> -ije </button> <button id="btn-je" class="btn-option px-8 py-4 rounded-2xl text-white font-black text-xl shadow-lg" style="background: linear-gradient(135deg, #60a5fa, #3b82f6);"> -je </button>
     </div>
    </div>
   </div><!-- End Screen -->
   <div id="end-screen" class="w-full max-w-md hidden">
    <div class="rounded-3xl p-8 text-center card-enter" style="background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(74,44,130,0.15);">
     <div id="end-emoji" class="text-6xl mb-3"></div>
     <h2 id="end-title" class="text-2xl font-black mb-2" style="color: #4a2c82;"></h2>
     <p id="end-message" class="text-sm mb-2" style="color: #6b4c9a;"></p>
     <div id="end-score" class="text-5xl font-black my-4 star-spin" style="color: #8b5cf6;"></div>
     <div id="end-details" class="text-sm mb-5" style="color: #6b4c9a;"></div><!-- Word review -->
     <div id="word-review" class="text-left mb-5 max-h-48 overflow-auto rounded-2xl p-3" style="background: rgba(139,92,246,0.08);"></div><button id="replay-btn" class="btn-option px-8 py-3 rounded-2xl text-white font-extrabold text-lg shadow-lg" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);"> 🔄 Igraj ponovo! </button>
    </div>
   </div>
  </div>
  <script>
    // Word database: [word, group] where group is "ije" or "je"
    const allWords = [
      ["dijete", "ije"], ["mlijeko", "ije"], ["lijep", "ije"], ["lijepo", "ije"],
      ["cvijet", "ije"], ["svijet", "ije"], ["snijeg", "ije"], ["rijeka", "ije"],
      ["dijeliti", "ije"], ["tijelo", "ije"], ["gnijezdo", "ije"], ["smijeh", "ije"],
      ["smiješan", "ije"], ["pijesak", "ije"], ["pijetao", "ije"], ["bijela", "ije"],
      ["vijest", "ije"], ["lijek", "ije"], ["liječnik", "ije"],
      ["mjesto", "je"], ["sjena", "je"], ["sjemenka", "je"],
      ["medvjed", "je"], ["mjesec", "je"], ["pjesma", "je"], ["rječnik", "je"],
      ["djevojčica", "je"], ["djeca", "je"], ["vrijeme", "ije"],
    ];

    const TOTAL_QUESTIONS = 10;
    let gameWords = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let results = []; // track each answer

    // Shuffle array
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Pick 10 random words, ensuring mix of ije and je
    function pickWords() {
      const ijeWords = shuffle(allWords.filter(w => w[1] === "ije"));
      const jeWords = shuffle(allWords.filter(w => w[1] === "je"));
      // At least 3 je words, rest ije
      const jeCount = Math.min(Math.max(3, Math.floor(Math.random() * 5) + 2), jeWords.length);
      const ijeCount = TOTAL_QUESTIONS - jeCount;
      const picked = [...jeWords.slice(0, jeCount), ...ijeWords.slice(0, ijeCount)];
      return shuffle(picked);
    }

    // Replace ije/je with flower emoji
    function makeFlowerWord(word, group) {
      const pattern = group === "ije" ? "ije" : "je";
      const idx = word.indexOf(pattern);
      if (idx === -1) return word;
      const before = word.substring(0, idx);
      const after = word.substring(idx + pattern.length);
      return `${before}<span class="flower-bounce text-4xl md:text-5xl">🌼</span>${after}`;
    }

    // DOM refs
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');
    const progressArea = document.getElementById('progress-area');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const scoreDisplay = document.getElementById('score-display');
    const wordDisplay = document.getElementById('word-display');
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackMsg = document.getElementById('feedback-msg');
    const buttonsArea = document.getElementById('buttons-area');
    const btnIje = document.getElementById('btn-ije');
    const btnJe = document.getElementById('btn-je');
    const nextBtn = document.getElementById('next-btn');
    const wordCard = document.getElementById('word-card');

    function startGame() {
      gameWords = pickWords();
      currentIndex = 0;
      score = 0;
      answered = false;
      results = [];
      startScreen.classList.add('hidden');
      endScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      progressArea.classList.remove('hidden');
      updateProgress();
      showWord();
    }

    function updateProgress() {
      progressText.textContent = `Pitanje ${currentIndex + 1}/${TOTAL_QUESTIONS}`;
      scoreDisplay.textContent = `⭐ ${score}/${TOTAL_QUESTIONS}`;
      progressBar.style.width = `${((currentIndex) / TOTAL_QUESTIONS) * 100}%`;
    }

    function showWord() {
      answered = false;
      const [word, group] = gameWords[currentIndex];
      wordDisplay.innerHTML = makeFlowerWord(word, group);
      feedbackArea.classList.add('hidden');
      buttonsArea.classList.remove('hidden');
      btnIje.disabled = false;
      btnJe.disabled = false;
      btnIje.style.opacity = '1';
      btnJe.style.opacity = '1';
      wordCard.classList.remove('feedback-correct', 'feedback-wrong');
      wordCard.className = 'rounded-3xl p-6 text-center card-enter';
      wordCard.style.background = 'rgba(255,255,255,0.88)';
    }

    function handleAnswer(chosen) {
      if (answered) return;
      answered = true;
      const [word, group] = gameWords[currentIndex];
      const correct = chosen === group;

      results.push({ word, group, chosen, correct });

      if (correct) {
        score++;
        scoreDisplay.textContent = `⭐ ${score}/${TOTAL_QUESTIONS}`;
        scoreDisplay.classList.add('score-pulse');
        setTimeout(() => scoreDisplay.classList.remove('score-pulse'), 400);
        feedbackMsg.innerHTML = `✅ Točno! Riječ je: <strong>${word}</strong>`;
        feedbackMsg.style.color = '#065f46';
        feedbackMsg.style.background = 'rgba(209,250,229,0.8)';
        wordCard.classList.add('feedback-correct');
        spawnMiniConfetti();
      } else {
        feedbackMsg.innerHTML = `❌ Netočno! Točan odgovor: <strong>-${group}</strong> → <strong>${word}</strong>`;
        feedbackMsg.style.color = '#991b1b';
        feedbackMsg.style.background = 'rgba(254,226,226,0.8)';
        wordCard.classList.add('feedback-wrong');
      }

      // Show correct word
      wordDisplay.innerHTML = `<span style="color: ${correct ? '#059669' : '#dc2626'}">${word}</span>`;

      feedbackArea.classList.remove('hidden');
      feedbackMsg.className = 'text-lg font-bold rounded-2xl py-3 px-4 result-pop';

      btnIje.disabled = true;
      btnJe.disabled = true;
      if (chosen === 'ije') {
        btnJe.style.opacity = '0.4';
      } else {
        btnIje.style.opacity = '0.4';
      }

      // Auto-advance to next word after 1.5 seconds
      setTimeout(() => {
        if (currentIndex < TOTAL_QUESTIONS - 1) {
          nextWord();
        } else {
          showEndScreen();
        }
      }, 1500);
    }

    function nextWord() {
      currentIndex++;
      if (currentIndex >= TOTAL_QUESTIONS) {
        showEndScreen();
        return;
      }
      updateProgress();
      showWord();
    }

    function showEndScreen() {
      gameScreen.classList.add('hidden');
      progressArea.classList.add('hidden');
      endScreen.classList.remove('hidden');

      const pct = (score / TOTAL_QUESTIONS) * 100;
      let emoji, title, message;

      if (pct === 100) {
        emoji = '🏆🌟🎉';
        title = 'Savršeno!';
        message = 'Sve si pogodio/la! Čestitamo!';
        launchConfetti();
      } else if (pct >= 80) {
        emoji = '🌟😄';
        title = 'Odlično!';
        message = 'Vrlo dobar posao! Bravo!';
        launchConfetti();
      } else if (pct >= 60) {
        emoji = '👍😊';
        title = 'Dobro!';
        message = 'Dobar rezultat, nastavi vježbati!';
      } else if (pct >= 40) {
        emoji = '💪🤔';
        title = 'Može bolje!';
        message = 'Probaj ponovo i bit će bolje!';
      } else {
        emoji = '📚😅';
        title = 'Trebat će vježbe!';
        message = 'Ne brini, vježbom se uči!';
      }

      document.getElementById('end-emoji').textContent = emoji;
      document.getElementById('end-title').textContent = title;
      document.getElementById('end-message').textContent = message;
      document.getElementById('end-score').textContent = `${score}/${TOTAL_QUESTIONS}`;
      document.getElementById('end-details').textContent = `Točnost: ${pct}%`;

      // Word review
      const reviewEl = document.getElementById('word-review');
      reviewEl.innerHTML = '<p class="font-bold text-sm mb-2" style="color: #4a2c82;">Pregled odgovora:</p>' +
        results.map(r =>
          `<div class="flex items-center gap-2 py-1 text-sm">
            <span>${r.correct ? '✅' : '❌'}</span>
            <span class="font-bold">${r.word}</span>
            <span style="color: #888;">(-${r.group})</span>
            ${!r.correct ? `<span style="color: #dc2626; font-size: 0.75rem;">tvoj odgovor: -${r.chosen}</span>` : ''}
          </div>`
        ).join('');
    }

    function spawnMiniConfetti() {
      const colors = ['#f472b6', '#8b5cf6', '#60a5fa', '#34d399', '#fbbf24', '#f87171'];
      for (let i = 0; i < 8; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = `${30 + Math.random() * 40}%`;
        el.style.top = `${20 + Math.random() * 10}%`;
        el.style.width = '10px';
        el.style.height = '10px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = `${1 + Math.random() * 1.5}s`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2500);
      }
    }

    function launchConfetti() {
      const colors = ['#f472b6', '#8b5cf6', '#60a5fa', '#34d399', '#fbbf24', '#f87171', '#ec4899', '#a78bfa'];
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'confetti-piece';
          el.style.left = `${Math.random() * 100}%`;
          el.style.top = '-10px';
          el.style.width = `${6 + Math.random() * 10}px`;
          el.style.height = `${6 + Math.random() * 10}px`;
          el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          el.style.animationDuration = `${2 + Math.random() * 2}s`;
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 4000);
        }, i * 60);
      }
    }

    // Event listeners
    document.getElementById('start-btn').addEventListener('click', startGame);
    btnIje.addEventListener('click', () => handleAnswer('ije'));
    btnJe.addEventListener('click', () => handleAnswer('je'));
    document.getElementById('replay-btn').addEventListener('click', startGame);

    // Element SDK
    const defaultConfig = {
      game_title: '🌸 Pogodi -ije ili -je! 🌸',
      subtitle: 'Klikni na točnu glasovnu skupinu',
      background_color: '#fbc2eb',
      surface_color: '#ffffff',
      text_color: '#4a2c82',
      primary_action_color: '#8b5cf6',
      secondary_action_color: '#ec4899',
      font_family: 'Nunito',
      font_size: 16
    };

    async function onConfigChange(config) {
      const bg = config.background_color || defaultConfig.background_color;
      const surface = config.surface_color || defaultConfig.surface_color;
      const text = config.text_color || defaultConfig.text_color;
      const primary = config.primary_action_color || defaultConfig.primary_action_color;
      const secondary = config.secondary_action_color || defaultConfig.secondary_action_color;
      const font = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;

      // Background
      const wrapper = document.getElementById('app-wrapper');
      wrapper.style.background = `linear-gradient(135deg, ${bg} 0%, ${primary}33 50%, ${secondary}33 100%)`;

      // Title & subtitle
      const titleEl = document.getElementById('game-title');
      const subtitleEl = document.getElementById('game-subtitle');
      titleEl.textContent = config.game_title || defaultConfig.game_title;
      subtitleEl.textContent = config.subtitle || defaultConfig.subtitle;
      titleEl.style.color = text;
      subtitleEl.style.color = text + 'cc';
      titleEl.style.fontFamily = `${font}, Nunito, sans-serif`;
      subtitleEl.style.fontFamily = `${font}, Nunito, sans-serif`;
      titleEl.style.fontSize = `${fontSize * 2}px`;
      subtitleEl.style.fontSize = `${fontSize * 0.875}px`;

      // Cards
      document.querySelectorAll('[style*="rgba(255,255,255"]').forEach(el => {
        el.style.background = `${surface}e0`;
      });

      // Text color
      document.querySelectorAll('[style*="color: #4a2c82"], [style*="color: #6b4c9a"], [style*="color: #3b1f6e"]').forEach(el => {
        el.style.color = text;
      });

      // Buttons - primary action (start, replay, next)
      const primaryBtns = [document.getElementById('start-btn'), document.getElementById('replay-btn'), nextBtn];
      primaryBtns.forEach(btn => {
        if (btn) btn.style.background = `linear-gradient(135deg, ${primary}, ${secondary})`;
      });

      // Option buttons
      btnIje.style.background = `linear-gradient(135deg, ${secondary}, ${secondary}dd)`;
      btnJe.style.background = `linear-gradient(135deg, ${primary}, ${primary}dd)`;

      // Font
      document.body.style.fontFamily = `${font}, Nunito, sans-serif`;

      // Score & progress text
      const progressTextEl = document.getElementById('progress-text');
      if (progressTextEl) progressTextEl.style.color = text;
      const scoreEl = document.getElementById('score-display');
      if (scoreEl) scoreEl.style.color = text;

      // Font size scaling
      const wordDisp = document.getElementById('word-display');
      if (wordDisp) wordDisp.style.fontSize = `${fontSize * 2}px`;
      const feedbackM = document.getElementById('feedback-msg');
      if (feedbackM) feedbackM.style.fontSize = `${fontSize * 1.125}px`;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); }
          },
          {
            get: () => config.surface_color || defaultConfig.surface_color,
            set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); }
          },
          {
            get: () => config.primary_action_color || defaultConfig.primary_action_color,
            set: (v) => { config.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); }
          },
          {
            get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
            set: (v) => { config.secondary_action_color = v; window.elementSdk.setConfig({ secondary_action_color: v }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["game_title", config.game_title || defaultConfig.game_title],
        ["subtitle", config.subtitle || defaultConfig.subtitle]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
